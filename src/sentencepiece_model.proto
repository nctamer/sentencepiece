syntax = "proto2";

// TODO(taku): Needs to use LITE RUNTIME in OSS release.
option optimize_for = LITE_RUNTIME;

package sentencepiece;

// TrainerSpec encodes a various parameters for SentencePiece training.
// Next id: 58
message TrainerSpec {
  ///////////////////////////////////////////////////////////////////
  // General parameters
  //
  // Input corpus files.
  //  Trainer accepts the following two formats:
  //  A) Monolingual: plain text, one sentence per line.
  //  B) Bilingual:   TSV, source sentence <tab> target sentence
  //  When bilingual data is passed, shared vocabulary model is built.
  //  Note that the input file must be raw corpus, not a preprocessed corpus.
  //  Trainer only loads the first `input_sentence_size` sentences specified
  //  with this parameter.
  repeated string input = 1;

  // Input corpus format:
  // "text": one-sentence-per-line text format (default)
  // "tsv":  sentence <tab> freq
  optional string input_format = 7;

  // Output model file prefix.
  // <model_prefix>.model and <model_prefix>.vocab are generated.
  optional string model_prefix = 2;

  // Model type. only have UNIGRAM now.
  enum ModelType {
    UNIGRAM = 1;  // Unigram language model with dynamic algorithm
    BPE = 2;      // Byte Pair Encoding
    WORD = 3;     // Delimitered by whitespace.
    CHAR = 4;     // tokenizes into character sequence
  }
  optional ModelType model_type = 3 [default = UNIGRAM];

  // Vocabulary size. 8k is the default size.
  optional int32 vocab_size = 4 [default = 8000];

  // List of the languages this model can accept.
  repeated string accept_language = 5;

  ///////////////////////////////////////////////////////////////////
  // Training parameters.
  optional float character_coverage = 10 [default = 0.9995];
  optional uint64 input_sentence_size = 11 [default = 0];
  optional bool shuffle_input_sentence = 19 [default = true];
  optional int32 seed_sentencepiece_size = 14 [default = 1000000];
  optional float shrinking_factor = 15 [default = 0.75];
  optional int32 max_sentence_length = 18 [default = 4192];
  optional int32 num_threads = 16 [default = 16];
  optional int32 num_sub_iterations = 17 [default = 2];

  ///////////////////////////////////////////////////////////////////
  // SentencePiece parameters which control the shapes of sentence piece.
  optional int32 max_sentencepiece_length = 20 [default = 16];
  optional bool split_by_unicode_script = 21 [default = true];
  optional bool split_by_number = 23 [default = true];
  optional bool split_by_whitespace = 22 [default = true];
  optional bool treat_whitespace_as_suffix = 24 [default = false];
  optional bool allow_whitespace_only_pieces = 26 [default = false];
  optional bool split_digits = 25 [default = false];
  optional string pretokenization_delimiter = 53 [default = ""];

  ///////////////////////////////////////////////////////////////////
  // Vocabulary management
  repeated string control_symbols = 30;
  repeated string user_defined_symbols = 31;
  optional string required_chars = 36;
  optional bool byte_fallback = 35 [default = false];
  optional bool vocabulary_output_piece_score = 32 [default = true];
  optional bool hard_vocab_limit = 33 [default = true];
  optional bool use_all_vocab = 34 [default = false];

  ///////////////////////////////////////////////////////////////////
  // Reserved special meta tokens.
  optional int32 unk_id = 40 [default = 0];
  optional int32 bos_id = 41 [default = 1];
  optional int32 eos_id = 42 [default = 2];
  optional int32 pad_id = 43 [default = -1];
  optional string unk_piece = 45 [default = "<unk>"];
  optional string bos_piece = 46 [default = "<s>"];
  optional string eos_piece = 47 [default = "</s>"];
  optional string pad_piece = 48 [default = "<pad>"];
  optional string unk_surface = 44 [default = " \xE2\x81\x87 "];
  optional bool train_extremely_large_corpus = 49 [default = false];
  optional string seed_sentencepieces_file = 54 [default = ""];

  // First-class continuation inputs. These fields intentionally live in the
  // ordinary TrainerSpec range so all language bindings and spec parsers can
  // transport them without knowing about a tokenizer family adapter.
  //
  // BPE: binary ExpansionSpec. The adapter that creates it is authoritative for
  // external IDs, merge ranks, reversible atomic alphabet and boundary policy.
  optional string expansion_spec = 55 [default = ""];

  // Optional binary ExpansionResult output path. If empty, continuation writes
  // <model_prefix>.expansion when model_prefix is available.
  optional string expansion_result = 56 [default = ""];

  // Native Unigram continuation: authoritative prior SentencePiece ModelProto.
  // All inherited piece IDs/types are copied from this file; inherited NORMAL
  // scores are constrained to the common additive-length gauge during EM.
  optional string unigram_prior_model = 57 [default = ""];

  reserved 6;
  reserved 12;
  reserved 13;
  reserved 50;
  reserved 51;
  reserved 52;

  // The old fork used extension IDs 200-205 for Intermo-specific splitting,
  // protected-piece files and seed-merge files. Continuation is a clean break:
  // never reuse those numbers for a new wire meaning.
  reserved 200 to 205;
  extensions 206 to max;
}

message NormalizerSpec {
  optional string name = 1;
  optional bytes precompiled_charsmap = 2;
  optional bool add_dummy_prefix = 3 [default = true];
  optional bool remove_extra_whitespaces = 4 [default = true];
  optional bool escape_whitespaces = 5 [default = true];
  optional string normalization_rule_tsv = 6;
  extensions 200 to max;
}

// A piece in an external tokenizer's immutable ID ABI or in its appended
// continuation region. `atomic` is meaningful for BPE: the piece is exactly one
// atom in the reversible representation supplied by the tokenizer adapter.
// Atomic strings may contain multiple Unicode scalars; a valid ExpansionSpec
// must induce exactly one segmentation of every continuation corpus record into
// declared atomic strings. Ambiguous or uncovered records are rejected before
// merge replay/learning.
message ExpansionPiece {
  required int32 external_id = 1;
  required string piece = 2;
  optional ModelProto.SentencePiece.Type type = 3 [default = NORMAL];
  optional float score = 4 [default = 0.0];
  optional bool mergeable = 5 [default = true];
  optional bool atomic = 6 [default = false];
}

// One exact BPE construction. `rank` is rank within the list in which the
// message appears in ExpansionSpec; ExpansionResult rewrites it to the final
// effective rank. `external_id` names the child `left + right`.
message ExpansionMerge {
  required int32 rank = 1;
  required string left = 2;
  required string right = 3;
  optional int32 external_id = 4 [default = -1];
}

enum ExpansionModelType {
  EXPANSION_UNSPECIFIED = 0;
  EXPANSION_BPE = 1;
  EXPANSION_UNIGRAM = 2;
}

// Adapter-produced authoritative continuation state. Generic trainer code must
// not reconstruct merge ranks, IDs, token types, regexes, byte mappings or
// tokenizer-specific grammar from piece strings.
message ExpansionSpec {
  optional int32 schema_version = 1 [default = 1];
  required ExpansionModelType model_type = 2;
  repeated ExpansionPiece base_pieces = 3;
  repeated ExpansionMerge base_merges = 4;
  repeated ExpansionPiece bootstrap_pieces = 5;
  repeated ExpansionMerge bootstrap_merges = 6;
  optional bool preserve_base_ids = 7 [default = true];
  optional bool allow_rank_prepend = 8 [default = false];
  optional int32 first_new_external_id = 9 [default = -1];
  optional int32 requested_new_pieces = 10 [default = 0];
  optional string vocab_sha256 = 11;
  optional string merges_sha256 = 12;
  optional string tokenizer_sha256 = 13;
  optional string pretokenizer_sha256 = 14;
  optional string boundary_policy = 15;
}

// Self-auditing continuation artifact. This is authoritative for external
// tokenizers even when their sparse ID space cannot be represented faithfully
// by a native contiguous SentencePiece ModelProto.
message ExpansionResult {
  optional int32 schema_version = 1 [default = 1];
  required ExpansionModelType model_type = 2;
  repeated ExpansionPiece base_pieces = 3;
  repeated ExpansionPiece bootstrap_pieces = 4;
  repeated ExpansionPiece learned_pieces = 5;
  repeated ExpansionMerge base_merges = 6;
  repeated ExpansionMerge bootstrap_merges = 7;
  repeated ExpansionMerge learned_merges = 8;
  optional int32 first_new_external_id = 9 [default = -1];
  optional int32 requested_new_pieces = 10 [default = 0];
  optional int32 actual_new_pieces = 11 [default = 0];
  optional int32 unreachable_pieces = 12 [default = 0];
  optional bool rank_prepend = 13 [default = false];
  optional string vocab_sha256 = 14;
  optional string merges_sha256 = 15;
  optional string tokenizer_sha256 = 16;
  optional string pretokenizer_sha256 = 17;
  optional string boundary_policy = 18;

  // Native Unigram continuation audit fields.
  optional string prior_model_sha256 = 19;
  optional int32 prior_piece_count = 20 [default = 0];
  optional double unigram_lambda = 21 [default = 0.0];
  optional double unigram_score_gauge_max_error = 22 [default = 0.0];
}

// ModelProto stores model parameters.
message ModelProto {
  message SentencePiece {
    enum Type {
      NORMAL = 1;
      UNKNOWN = 2;
      CONTROL = 3;
      USER_DEFINED = 4;
      BYTE = 6;
      UNUSED = 5;
    }
    optional string piece = 1;
    optional float score = 2;
    optional Type type = 3 [default = NORMAL];
    extensions 200 to max;
  }

  repeated SentencePiece pieces = 1;
  optional TrainerSpec trainer_spec = 2;
  optional NormalizerSpec normalizer_spec = 3;
  optional NormalizerSpec denormalizer_spec = 5;

  // Present only on continuation-produced native models. External-tokenizer
  // adapters should use the standalone ExpansionResult as the source of truth
  // when the external ID space is sparse or otherwise non-native.
  optional ExpansionResult expansion_result = 6;

  reserved 4;
  extensions 200 to max;
}
